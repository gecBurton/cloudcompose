name: AWS Acceptance

# On-demand real-AWS smoke test: deploys an example end to end, asserts it, and
# always tears it down. Runs in CI (stable networking) rather than on a laptop.
# Requires the repo Actions variable AWS_ACCEPTANCE_ROLE_ARN (see ci/README.md).
on:
  workflow_dispatch:
    inputs:
      example:
        description: Example to smoke test
        type: choice
        default: hello
        options:
          - hello
          - minio-s3
          - build-webapp
          - doctor
          - production-stack
          - web-api
      region:
        description: AWS region to deploy into
        type: choice
        default: eu-west-2
        options:
          - eu-west-2
          - us-east-1
          - us-west-2

permissions:
  id-token: write   # required for OIDC federation to AWS
  contents: read

# Never run two acceptance jobs at once: they share the bootstrap environment
# name space and would tear down each other's resources. Queue instead of
# cancelling — cancelling a run mid-apply is exactly what strands resources.
concurrency:
  group: aws-acceptance
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Bound the blast radius of a hang. Without this a stuck poll would sit on
    # GitHub's 6 hour default while a NAT gateway and ALB bill by the hour.
    # CloudFront is the long pole: a distribution takes about fifteen minutes to
    # deploy and must be disabled and propagated before it can be deleted, so a
    # production-stack run is far longer than the others.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # Prints the OIDC token's claims — never the token itself — so a trust
      # policy mismatch can be diagnosed from the log. AWS only ever reports
      # "Not authorized", never which claim failed to match, so without this the
      # `sub` GitHub actually sends is invisible. None of these claims are secret.
      - name: Debug OIDC claims
        run: |
          token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          # Decode the payload only; pad base64url so `base64 -d` accepts it.
          payload="$(printf '%s' "$token" | cut -d. -f2)"
          while (( ${#payload} % 4 )); do payload="${payload}="; done
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d \
            | jq '{sub, aud, iss, repository, repository_owner, ref, workflow_ref}'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        # A credential failure must fail fast: the action retries by default,
        # and each attempt can sit on network timeouts for minutes, silently
        # consuming the whole job budget without ever printing the AWS error.
        timeout-minutes: 5
        with:
          role-to-assume: ${{ vars.AWS_ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          retry-max-attempts: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cloudcompose-go/go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false   # let the script call the real terraform binary

      - name: Smoke test ${{ inputs.example }}
        env:
          PROFILE: ""                      # empty -> use ambient OIDC credentials
          NAME: ci${{ github.run_number }}  # unique, short, valid resource prefix
          REGION: ${{ inputs.region }}
          # Keeps Terraform state off the ephemeral runner so a cancelled or
          # timed-out run can still be destroyed afterwards.
          STATE_BUCKET: ${{ vars.AWS_ACCEPTANCE_STATE_BUCKET }}
          STATE_REGION: eu-west-2
          # Optional; unset -> unlocked S3 state, the same race
          # docs/multi-user-state.md exists to close for real
          # cloudcompose users. Set once ci/main.tf's own
          # aws_dynamodb_table.state_locks has been applied (see
          # ci/README.md).
          STATE_TABLE: ${{ vars.AWS_ACCEPTANCE_STATE_TABLE }}
        run: |
          case "${{ inputs.example }}" in
            hello)
              export COMPOSE=examples/hello/compose.yml PROJECT=hello \
                     EXPECT="Server name" ;;
            minio-s3)
              export COMPOSE=examples/minio-s3/compose.yml PROJECT=minios3 \
                     EXPECT="Server name" ;;
            build-webapp)
              export COMPOSE=examples/build-webapp/compose.yml PROJECT=buildweb \
                     EXPECT="hello from a cloudcompose-built image" ;;
            doctor)
              export COMPOSE=examples/doctor/compose.yml PROJECT=doctor \
                     HTTP_PATH=/health EXPECT='"status": "ok"' POLL_TIMEOUT=480 ;;
            web-api)
              export COMPOSE=examples/web-api/compose.yml PROJECT=webapi \
                     EXPECT="Server name" ;;
            production-stack)
              export COMPOSE=examples/production-stack/compose.yml PROJECT=prodstack \
                     EXPECT="Welcome to nginx" POLL_TIMEOUT=600 ;;
          esac
          scripts/smoke-test.sh
