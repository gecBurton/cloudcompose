name: Azure Acceptance

# On-demand real-Azure smoke test: deploys an example end to end, asserts it, and
# always tears it down. Runs in CI (stable networking) rather than on a laptop.
# Requires Azure credentials configured as GitHub secrets (see ci/README.md).
on:
  workflow_dispatch:
    inputs:
      # Only examples that can actually deploy belong here. The flask family
      # was adapted from awesome-compose without its `build:` sections, so it
      # names images like "flask-app" that exist on a developer's machine and
      # in no registry — Azure resolves those against Docker Hub and refuses
      # them. Those examples still earn their keep as compile-only golden
      # tests; they are not smoke-testable anywhere.
      example:
        description: Example to smoke test
        type: choice
        default: hello
        options:
          - hello
          - web-api
          - minio-s3
          - production-stack
      region:
        description: Azure region to deploy into
        type: choice
        default: northeurope
        options:
          - northeurope
          - uksouth
          - westeurope
          - swedencentral

permissions:
  contents: read

# Never run two acceptance jobs at once: they share the bootstrap environment
# name space and would tear down each other's resources.
concurrency:
  group: azure-acceptance
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Bound the blast radius of a hang. Generous because teardown of a
    # Container Apps environment alone takes ~26 minutes, and a job killed
    # mid-teardown leaves live resources behind.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Set up Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-v2

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure and register providers
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Login with service principal - this persists for subsequent steps
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          
          # Register required resource providers
          echo "Registering required Azure resource providers..."
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.ContainerInstance --wait
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.Network --wait
          # Needed by examples with managed backing services. Already
          # registered on a mature subscription; a fresh one fails at apply.
          az provider register --namespace Microsoft.DBforPostgreSQL --wait
          az provider register --namespace Microsoft.DBforMySQL --wait
          az provider register --namespace Microsoft.Cache --wait
          az provider register --namespace Microsoft.Cdn --wait
          az provider register --namespace Microsoft.KeyVault --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait
          az provider register --namespace Microsoft.Storage --wait
          echo "Resource providers registered."
          
          # Verify login persisted
          az account show

      - name: Smoke test ${{ inputs.example }}
        env:
          NAME: ci${{ github.run_number }}  # unique, short, valid resource prefix
          # Authenticate Terraform as the service principal. Not via the Azure
          # CLI session: the azurerm backend refuses a CLI login owned by a
          # service principal, so CLI auth cannot reach remote state.
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # Region under test. Not eastus: this subscription is offer-restricted
          # there for PostgreSQL Flexible Server (LocationIsOfferRestricted).
          REGION: ${{ inputs.region }}
          # Keeps Terraform state in Azure so a cancelled run can still be destroyed
          STATE_RG: ${{ vars.AZURE_STATE_RESOURCE_GROUP }}
          STATE_ACCOUNT: ${{ vars.AZURE_STATE_ACCOUNT }}
          STATE_LOCATION: eastus
        run: |
          case "${{ inputs.example }}" in
            hello)
              export COMPOSE=examples/hello/compose.yml PROJECT=hello \
                     EXPECT="Server name" ;;
            web-api)
              export COMPOSE=examples/web-api/compose.yml PROJECT=webapi \
                     EXPECT="Server name" ;;
            minio-s3)
              export COMPOSE=examples/minio-s3/compose.yml PROJECT=minios3 \
                     EXPECT="Server name" ;;
            production-stack)
              # Postgres and the CDN endpoint are both slow to provision, so
              # this is the longest run by some margin.
              export COMPOSE=examples/production-stack/compose.yml PROJECT=prodstack \
                     EXPECT="Welcome to nginx" POLL_TIMEOUT=480 ;;
            *)
              echo "::error::no smoke-test configuration for '${{ inputs.example }}'"
              exit 1 ;;
          esac
          scripts/smoke-test-azure.sh
