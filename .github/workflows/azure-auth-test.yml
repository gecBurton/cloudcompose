name: Azure Auth Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Test Azure CLI auth
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "Logging in with Service Principal..."
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          
          echo "Checking current account:"
          az account show
          
          echo "Checking resource provider registration status:"
          az provider show --namespace Microsoft.OperationalInsights --query registrationState
          
          echo "Registering providers:"
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider show --namespace Microsoft.OperationalInsights --query registrationState

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Test Terraform Azure auth
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          echo "ARM_CLIENT_ID: ${ARM_CLIENT_ID:0:8}..."
          echo "ARM_TENANT_ID: ${ARM_TENANT_ID:0:8}..."
          echo "ARM_SUBSCRIPTION_ID: ${ARM_SUBSCRIPTION_ID:0:8}..."
          
          cat > test.tf <<TFEOF
          provider "azurerm" {
            features {}
            client_id       = "$ARM_CLIENT_ID"
            client_secret   = "$ARM_CLIENT_SECRET"
            tenant_id       = "$ARM_TENANT_ID"
            subscription_id = "$ARM_SUBSCRIPTION_ID"
          }
          
          data "azurerm_client_config" "current" {}
          
          output "subscription_id" {
            value = data.azurerm_client_config.current.subscription_id
          }
          TFEOF
          
          terraform init
          terraform apply -auto-approve
