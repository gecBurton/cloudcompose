name: Azure Auth Test 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Debug subscription and tenant
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          
          echo "=== Service Principal Info ==="
          az ad sp show --id "$ARM_CLIENT_ID" --query "{appId:appId, tenant:appOwnerOrganizationId}"
          
          echo "=== Subscription Info ==="
          az account show --subscription "$ARM_SUBSCRIPTION_ID" --query "{id:id, name:name, tenantId:tenantId}"
          
          echo "=== Check if SP has access to subscription ==="
          az role assignment list --assignee "$ARM_CLIENT_ID" --subscription "$ARM_SUBSCRIPTION_ID"
