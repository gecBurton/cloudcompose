name: Azure Auth Test 5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Test with Azure CLI context
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Login with Azure CLI
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          
          # Get the access token from Azure CLI
          export ARM_ACCESS_TOKEN=$(az account get-access-token --resource https://management.core.windows.net/ --query accessToken -o tsv)
          export ARM_SUBSCRIPTION_ID="$ARM_SUBSCRIPTION_ID"
          
          echo "Testing with ARM_ACCESS_TOKEN from Azure CLI..."
          
          cat > main.tf <<'TFCODE'
          provider "azurerm" {
            features {}
            use_cli = false
            use_msi = false
          }
          
          data "azurerm_resource_group" "test" {
            name = "composey-acceptance"
          }
          
          output "rg_name" {
            value = data.azurerm_resource_group.test.name
          }
          TFCODE
          
          terraform init
          terraform apply -auto-approve
