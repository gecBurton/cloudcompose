name: Azure Auth Test 6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Test Terraform with MSI-like auth
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # Login with Azure CLI
          az login --service-principal \
            --username "$ARM_CLIENT_ID" \
            --password "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID"
          az account set --subscription "$ARM_SUBSCRIPTION_ID"
          
          # Get token with correct resource for Azure Resource Manager
          # The Azure provider uses https://management.azure.com/ as the resource
          TOKEN=$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)
          echo "Got token: ${TOKEN:0:30}..."
          
          # Export for Terraform
          export ARM_ACCESS_TOKEN="$TOKEN"
          export ARM_SUBSCRIPTION_ID="$ARM_SUBSCRIPTION_ID"
          
          cat > main.tf <<'TFCODE'
          provider "azurerm" {
            features {}
            use_cli = false
            use_msi = false
            use_oidc = false
          }
          
          data "azurerm_client_config" "current" {}
          
          output "subscription_id" {
            value = data.azurerm_client_config.current.subscription_id
          }
          
          output "tenant_id" {
            value = data.azurerm_client_config.current.tenant_id
          }
          TFCODE
          
          terraform init
          terraform apply -auto-approve
