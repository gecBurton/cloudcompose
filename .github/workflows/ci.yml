name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.10.0"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: composey-go/go.mod
        cache-dependency-path: composey-go/go.sum

    - name: Run go vet and go test
      run: go vet ./... && go test ./...
      working-directory: composey-go

    - name: Build composey binary
      run: go build -o composey ./cmd/composey
      working-directory: composey-go
