name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: "1.10.0"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: cloudcompose-go/go.mod
        cache-dependency-path: cloudcompose-go/go.sum

    # disable_grpc_modules opts cloud.google.com/go/storage out of its
    # gRPC transport (and the gRPC/xds/envoy/OpenTelemetry dependency
    # chain that pulls in) -- this codebase's own GCS listing only ever
    # uses the default JSON/XML REST transport, see
    # internal/compiler/gcp/backend_listing.go. Keep in sync with the
    # repo Makefile and .goreleaser.yaml so CI, local dev, and released
    # binaries all agree on the same smaller build.
    - name: Run go vet and go test
      run: go vet -tags disable_grpc_modules ./... && go test -tags disable_grpc_modules ./...
      working-directory: cloudcompose-go

    - name: Check Terraform schema compatibility
      run: go run ./cmd/schema-check
      working-directory: cloudcompose-go

    - name: Build cloudcompose binary
      run: go build -tags disable_grpc_modules -o cloudcompose ./cmd/cloudcompose
      working-directory: cloudcompose-go
