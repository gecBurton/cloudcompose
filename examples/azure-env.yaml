# Azure Environment Configuration Example

name: prod
region: eastus
target: azure

# Container Apps Environment
container_apps_environment_name: prod-web-api
log_analytics_workspace_id: /subscriptions/12345678-1234-1234-1234-123456789012/resourceGroups/prod/providers/Microsoft.OperationalInsights/workspaces/prod-logs

# VNet Integration
vnet_id: /subscriptions/12345678-1234-1234-1234-123456789012/resourceGroups/prod/providers/Microsoft.Network/virtualNetworks/prod-vnet
infrastructure_subnet_id: /subscriptions/12345678-1234-1234-1234-123456789012/resourceGroups/prod/providers/Microsoft.Network/virtualNetworks/prod-vnet/subnets/container-apps

# Container Registry (optional - creates new if not specified)
container_registry_name: prodwebapiacr

# PostgreSQL (optional - creates new if not specified)
# postgresql_server_id: /subscriptions/.../providers/Microsoft.DBforPostgreSQL/flexibleServers/prod-pg

# Identity (optional - uses system-assigned if not specified)
# user_assigned_identity_id: /subscriptions/.../providers/Microsoft.ManagedIdentity/userAssignedIdentities/prod-apps

# Data retention
retain_data_on_destroy: true
log_retention_days: 30

# Tags
tags:
  Environment: production
  ManagedBy: composey
