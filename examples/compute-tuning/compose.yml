services:
  api:
    image: my-api:latest
    ports:
      - "80:8080"
    x-cloud:
      ingress: {}
      cpu: 1024
      memory: 2048
  worker:
    image: my-worker:latest
    x-cloud:
      size: medium
      cpu: 2048 # Override medium's 1024, paired with memory below
      memory: 4096 # Override medium's 2048 -- 2.0 vCPU/4Gi is a valid pair on both AWS and Azure
