# Authored environment.yaml for the "hello" example, Azure variant. See
# examples/hello/environment.yaml (the AWS version) for the full
# explanation of what this file is and isn't.
#
# region is francecentral, not the more obvious eastus: eastus has known
# PostgreSQL Flexible Server and Managed Redis capacity/quota
# restrictions that have already caused a real CI failure once (see
# .github/workflows/azure-acceptance.yml's own region-input comment) --
# francecentral is the documented-safe default for exactly that reason.
provider: azure
name: demo
region: francecentral
retain_data_on_destroy: true
high_availability_enabled: false # ZoneRedundant roughly doubles Flexible Server compute cost; opt-in
backup_retention_days: 7
tags:
  Team: platform

azure:
  vnet_cidr: 10.0.0.0/16
