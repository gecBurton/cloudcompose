services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
    environment:
      # Rewritten to the RDS endpoint and the ElastiCache address. Without
      # these the service depends on both and can reach neither, which is what
      # `--explain` warns about.
      DB_HOST: db
      REDIS_URL: redis://cache
    depends_on:
      - cache
      - db
    x-cloud:
      ingress: {}
      size: medium
      min_scale: 2
      max_scale: 10
      cdn: true

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=password

  cache:
    image: redis:alpine

  cleanup:
    image: busybox
    command: ["echo", "cleaning up..."]
    x-cloud:
      schedule: "0 2 * * *"
