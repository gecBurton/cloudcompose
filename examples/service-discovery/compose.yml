# Two containers that talk to each other — the shape no other example had, and
# the reason cloudcompose shipped for eight days with no service discovery at all.
#
# Compose puts both on a shared network where `api` resolves by name. ECS gives
# a task no name whatsoever, so cloudcompose registers each reachable service in a
# private DNS zone and rewrites references to it; Azure gives `api` internal-only
# ingress and rewrites the reference to its Container App name.
#
# `web` proves the hop rather than assuming it: every request fetches API_URL
# and says whether it got through, so the acceptance smoke test can expect
# "web reached api" instead of only checking that `web` itself is up. It
# always answers 200 so load-balancer health checks don't depend on `api`.
name: service-discovery
services:
  web:
    image: python:3.12-alpine
    command:
      - python
      - -c
      - |
        import os, urllib.request
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                url = os.environ["API_URL"]
                try:
                    with urllib.request.urlopen(url, timeout=5) as r:
                        body = "web reached api at %s:\n%s" % (url, r.read().decode())
                except Exception as e:
                    body = "web could not reach api at %s: %r\n" % (url, e)
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.end_headers()
                self.wfile.write(body.encode())

        HTTPServer(("", 80), Handler).serve_forever()
    ports:
      - "80:80"
    environment:
      # Resolves to api.<environment>-<application>.internal on AWS, and to
      # api's Container App name on Azure, once compiled.
      API_URL: http://api
    depends_on:
      - api
    networks:
      - app
    x-cloud:
      ingress: {}

  api:
    image: nginxdemos/hello:plain-text
    # Not published to the host: reachable by `web`, not from outside.
    ports:
      - "80"
    networks:
      - app

networks:
  app:
