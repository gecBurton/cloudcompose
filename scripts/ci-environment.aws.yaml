# Shared environment.yaml for the AWS acceptance workflow
# (.github/workflows/acceptance.yml). One environment is created per CI
# run and shared by whichever example that run deploys (hello,
# doctor, service-discovery, edge-and-scaling) -- these
# are all separate apps sharing one platform environment, which is the
# whole point of the init/main split (see
# docs/authored-environment-config.md). Not tied to any single example
# for that reason, unlike examples/hello/environment.yaml (which exists
# purely for the docs/README walkthrough).
#
# name: is a placeholder, not a real decision -- scripts/smoke-test.sh
# generates a per-run copy of this file with name: substituted for the
# run-specific value (ci<run-number>) before calling `cloud-compose env init`,
# since a shared AWS account needs a unique resource prefix per run and
# cloud-compose env init itself takes no flags to express that. region: below is
# likewise substituted per run, since it's a workflow_dispatch input
# (see acceptance.yml). See scripts/smoke-test.sh's own comments at the
# point it does this.
provider: aws
name: PLACEHOLDER
region: eu-west-2
retain_data_on_destroy: false
# The CI AWS account is Free Tier-restricted, which caps RDS backup
# retention at 0 days -- cloud-compose's own default of 7
# (cmd/cloudcompose/env_init.go) exceeds that and AWS rejects
# CreateDBInstance outright (FreeTierRestrictionError) before Terraform
# gets anywhere near applying it. 0 here is a CI-account constraint, not
# a recommended production value; see examples/*/environment.yaml for
# defaults meant to be deployed for real.
backup_retention_days: 0
tags:
  ManagedBy: cloudcompose-acceptance-ci

aws:
  vpc_cidr: 10.0.0.0/16
  az_count: 2
  create_alb: true

# local: is the default here for a bare local run (PROFILE set,
# STATE_BUCKET unset): state stays on disk under build/aws/env-<name>,
# fine for a laptop where the files persist between commands. When
# STATE_BUCKET is set (always true in CI -- see acceptance.yml),
# scripts/smoke-test.sh's own templating step replaces this entire
# block with `remote:` (S3, bucket/region/dynamodb_table from
# STATE_BUCKET/STATE_REGION/STATE_TABLE) before calling `env init` --
# cloud-compose then generates both the environment's own backend
# block AND every app compiled against it, with a deterministic,
# collision-free key derived from name: (see
# internal/compiler/shared/backend_naming.go's BackendKeyForEnvironment/
# BackendKeyForApp) -- no separate, hand-rolled backend file needed on
# top of what `env init`/`compile` already emit (a previous version of
# this script wrote one anyway, which collided with this block once
# backend: became mandatory and produced a real "Duplicate backend
# configuration" failure -- see the run this comment was added
# alongside fixing).
backend:
  local:
    path: ./terraform.tfstate
